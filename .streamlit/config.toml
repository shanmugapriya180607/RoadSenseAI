# Streamlit base theme for RoadSense AI.
# This sets sensible defaults; ui.py's injected CSS handles the full
# premium light/dark styling and the runtime theme switch.

[theme]
base = "dark"
primaryColor = "#8B5CF6"
backgroundColor = "#09090F"
secondaryBackgroundColor = "#121218"
textColor = "#F4F4F6"
font = "sans serif"

[client]
toolbarMode = "minimal"

[server]
runOnSave = true
